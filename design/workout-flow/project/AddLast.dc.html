<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Last exercise, add in the arrow slot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
input { font: inherit; color: inherit; background: none; border: none; outline: none; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 14px 0; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 14px; font-weight: 700">Pull · Back &amp; Biceps</div><div style="display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span><span class="num" style="font-size: 12px; color: #8A9593">48:12</span><span style="font-size: 12px; color: #8A9593">elapsed</span></div></div>
    <button type="button" aria-label="Workout options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </header>
  <section style="padding: 16px 14px 0; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Previous exercise: Barbell Curl" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #1A1D1F; border: 1px solid #2A2F31; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="text-align: center; font-size: 22px; font-weight: 700; line-height: 1.1">Hammer Curl <span style="color: #8A9593">· Dumbbell</span></div>
      <div style="display: flex; align-items: center"><span style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Exercise <span class="num">6</span> of <span class="num">6</span></span><button type="button" aria-label="Hammer Curl, Dumbbell options" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #8A9593"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button></div>
    </div>
    <button type="button" aria-label="Add exercise" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #1A1D1F; border: 1px solid {{accent}}; display: flex; align-items: center; justify-content: center; color: {{accent}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
  </section>
  <div aria-hidden="true" style="margin: 12px 14px 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
    <span style="height: 4px; border-radius: 2px; background: #9FC9D2"></span><span style="height: 4px; border-radius: 2px; background: #9FC9D2"></span><span style="height: 4px; border-radius: 2px; background: #9FC9D2"></span><span style="height: 4px; border-radius: 2px; background: #9FC9D2"></span><span style="height: 4px; border-radius: 2px; background: #9FC9D2"></span>
    <span style="height: 4px; border-radius: 2px; background: #3A4245; display: block; overflow: hidden"><span style="display: block; width: 67%; height: 4px; background: {{accent}}"></span></span>
  </div>
  <div style="margin: 14px 14px 0; border-radius: 16px; background: #1A1D1F; border: 1px solid #2A2F31; padding: 14px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Set <span class="num">3</span></span><button type="button" aria-label="Last time 14 by 10. Show history" style="height: 34px; padding: 0 11px; border-radius: 999px; background: #222628; border: 1px solid #3A4245; display: flex; align-items: center; gap: 7px"><span style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Last time</span><span class="num" style="font-size: 14px">14 × 10</span></button></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 8px; row-gap: 7px; align-items: center">
      <label for="mw" style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Weight kg</label>
      <label for="mr" style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Reps</label>
      <input id="mw" class="num" value="14" style="width: 100%; box-sizing: border-box; height: 62px; border-radius: 13px; background: #222628; border: 1px solid #6A7474; text-align: center; font-size: 30px; color: #6E7A78">
      <input id="mr" class="num" value="10" style="width: 100%; box-sizing: border-box; height: 62px; border-radius: 13px; background: #222628; border: 1px solid #6A7474; text-align: center; font-size: 30px; color: #6E7A78">
      <div style="display: flex; gap: 6px"><button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 14px">−2</button><button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 14px">+2</button></div>
      <div style="display: flex; gap: 6px"><button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 14px">−1</button><button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 14px">+1</button></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" aria-label="Repeat last session's set 3: 14 by 10" style="width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 1px solid #3A4245; color: #8A9593"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4"></path><path d="M3.5 3.8v5h5"></path></svg></button>
      <button type="button" style="flex-grow: 1; height: 56px; border-radius: 15px; background: {{accent}}; color: #121414; font-size: 16px; font-weight: 700">Log set 3</button>
    </div>
  </div>
  <section style="margin: 18px 14px 0; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Today</h2>
    <ul style="margin: 0; padding: 0; list-style: none; background: #1A1D1F; border: 1px solid #2A2F31; border-radius: 14px; overflow: hidden">
      <li style="min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 12px"><span class="num" style="width: 18px; font-size: 12px; color: #8A9593">1</span><span class="num" style="flex-grow: 1; font-size: 16px">14 kg × 10</span></li>
      <li style="min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #22272A"><span class="num" style="width: 18px; font-size: 12px; color: #8A9593">2</span><span class="num" style="flex-grow: 1; font-size: 16px">14 kg × 9</span></li>
    </ul>
  </section>
  <div style="flex-grow: 1"></div>
  <footer style="padding: 12px 14px 24px">
    <button type="button" style="width: 100%; height: 52px; border-radius: 15px; border: 1px solid #3A4245; font-size: 16px; font-weight: 700">Finish workout</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
