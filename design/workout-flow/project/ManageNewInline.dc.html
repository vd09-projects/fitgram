<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TICKET-041 C1 — new plan, option A</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
abbr { text-decoration: none; }
input { font: inherit; color: inherit; background: none; border: none; outline: none; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 22px 14px 4px; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Back" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #8A9593">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <h1 style="flex-grow: 1; margin: 0 44px 0 0; text-align: center; font-size: 18px; font-weight: 700">Manage Workout</h1>
  </header>
  <main style="flex-grow: 1; min-height: 0; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nwname" style="font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">New plan</label>
      <div style="display: flex; gap: 8px">
        <div style="flex-grow: 1; min-width: 0; height: 50px; padding: 0 14px; border-radius: 13px; background: #222628; border: 2px solid {{accent}}; display: flex; align-items: center">
          <input id="nwname" type="text" value="Legs · Quads" style="width: 100%; font-size: 15px; font-weight: 600" />
        </div>
        <button type="button" style="height: 50px; padding: 0 14px; flex-shrink: 0; border-radius: 13px; border: 1px solid #3A4245; font-size: 14px; font-weight: 600">Cancel</button>
      </div>
      <div style="font-size: 12px; color: #8A9593">Saved with its first exercise.</div>
    </div>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #8A9593">Exercises</h2>
      <div style="font-size: 13px; color: #8A9593">None yet</div>
      <button type="button" style="height: 50px; border-radius: 13px; border: 1px dashed #3A4245; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600"><span style="color: {{accent}}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Add exercise</button>
    </section>
  </main>
  <footer style="padding: 12px 14px 22px; background: #16191A; border-top: 1px solid #22272A">
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; background: #222628; color: #6E7A78; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 9px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Save plan</button>
  </footer></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
