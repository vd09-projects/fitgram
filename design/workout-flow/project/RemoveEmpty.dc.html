<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RM7 Everything removed, empty screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 14px 0; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 14px; font-weight: 700">Back &amp; Cardio</div><div style="display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span><span class="num" style="font-size: 12px; color: #8A9593">3:05</span><span style="font-size: 12px; color: #8A9593">elapsed</span></div></div>
    <button type="button" aria-label="Workout options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </header>
  <div role="status" style="margin: 12px 14px 0; min-height: 48px; padding: 0 4px 0 12px; box-sizing: border-box; border-radius: 12px; background: #1A1D1F; border: 1px solid #3A4245; display: flex; align-items: center; gap: 10px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A9593" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg>
    <span style="flex-grow: 1; font-size: 14px; font-weight: 700; color: #E8EDEC">Hammer Curl <span style="color: #8A9593">removed</span></span>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 700; color: {{accent}}">Undo</button>
  </div>
  <main style="flex-grow: 1; min-height: 0; padding: 0 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
    <span style="width: 56px; height: 56px; border-radius: 28px; background: #1E3A41; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
    <p style="margin: 0; font-size: 18px; font-weight: 700">Add your first exercise</p>
    <p style="margin: 0; max-width: 280px; font-size: 14px; line-height: 1.45; color: #8A9593">Log its sets, then add the next. Each one shows your last time, from any plan.</p>
    <button type="button" style="margin-top: 6px; height: 52px; padding: 0 28px; border-radius: 14px; background: {{accent}}; color: #121414; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add exercise</button>
  </main>
  <footer style="padding: 12px 14px 24px">
    <button type="button" style="width: 100%; height: 52px; border-radius: 15px; border: 1px solid #3A4245; font-size: 16px; font-weight: 700">Finish workout</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
