<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F3 Split started on the card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
input { font: inherit; color: inherit; background: none; border: none; outline: none; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 14px 0; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 15px; font-weight: 700">Pull · Back &amp; Biceps</div><div class="num" style="font-size: 12px; color: #8A9593">12:06 elapsed</div></div>
    <button type="button" aria-label="Workout options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </header>
  <div style="margin: 10px 14px 0; height: 4px; border-radius: 2px; background: #22272A"><div style="width: 4%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div>
  <section style="padding: 22px 14px 0; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Previous exercise" disabled style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #1A1D1F; border: 1px solid #2A2F31; display: flex; align-items: center; justify-content: center; color: #4A5254"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="text-align: center; font-size: 25px; font-weight: 700; line-height: 1.1">Lat Pulldown <span style="color: #8A9593">· Machine</span></div>
      <div style="display: flex; align-items: center"><span style="font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Exercise <span class="num">1</span> of <span class="num">6</span></span><button type="button" aria-label="Lat Pulldown, Machine options" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #8A9593"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button></div>
    </div>
    <button type="button" aria-label="Next exercise: Seated Cable Row" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #1A1D1F; border: 1px solid #2A2F31; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
  </section>
  <div style="margin: 12px 14px 0; border-radius: 16px; background: #1A1D1F; border: 1px solid #2A2F31; padding: 14px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Set <span class="num">1</span> <span style="color: #8A9593">· 1 split</span></span><button type="button" aria-label="Last time 55 by 10. Show history" style="height: 34px; padding: 0 11px; border-radius: 999px; background: #222628; border: 1px solid #3A4245; display: flex; align-items: center; gap: 7px"><span style="font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Last time</span><span class="num" style="font-size: 13px">55 × 10</span></button></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px; column-gap: 8px; row-gap: 7px; align-items: center">
      <span style="font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Weight kg</span>
      <span style="font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Reps</span>
      <span></span>
      <input class="num" aria-label="Weight" value="55" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 12px; background: #222628; border: 1px solid #6A7474; text-align: center; font-size: 22px">
      <input class="num" aria-label="Reps" value="6" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 12px; background: #222628; border: 1px solid #6A7474; text-align: center; font-size: 22px">
      <button type="button" aria-label="Remove the first row of set 1" style="width: 44px; height: 50px; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
      <input class="num" aria-label="Split 1 weight" value="45" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 12px; background: #222628; border: 1px solid #6A7474; text-align: center; font-size: 22px">
      <input class="num" aria-label="Split 1 reps" value="4" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 12px; background: #222628; border: 2px solid {{accent}}; text-align: center; font-size: 22px">
      <button type="button" aria-label="Add another split to set 1" style="width: 44px; height: 50px; border-radius: 12px; border: 1px solid #3A4245; color: #C6CFCD; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M8 3H3v5"></path><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"></path><path d="m15 9 6-6"></path></svg>split</button>
    </div>
    <button type="button" style="height: 56px; border-radius: 15px; background: {{accent}}; color: #121414; font-size: 15.5px; font-weight: 700">Log set 1</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
