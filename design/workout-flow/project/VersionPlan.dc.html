          </div>

          </div>
          </div>
        </li>
        <li style="border-top: 1px solid #22272A">
          <button type="button" aria-expanded="false" style="width: 100%; min-height: 56px; padding: 8px 12px 8px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; text-align: left">

        </li>
        <li style="border-top: 1px solid #22272A">
          <button type="button" aria-expanded="false" style="width: 100%; min-height: 56px; padding: 8px 12px 8px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; text-align: left">
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">

      <button type="button" style="height: 50px; border-radius: 13px; border: 1px dashed #3A4245; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600"><span style="color: {{accent}}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Add exercise</button>
    </section>
  </main>
  <footer style="padding: 12px 14px 22px; background: #16191A; border-top: 1px solid #22272A">
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; background: {{accent}}; color: #121414; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 9px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Save changes</button>
  </footer></div>
