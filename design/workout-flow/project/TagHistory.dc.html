<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TICKET-041 C5 — history sheet: a session's tags</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
abbr { text-decoration: none; }
input { font: inherit; color: inherit; background: none; border: none; outline: none; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column">
    <div aria-hidden="true" style="opacity: 0.3">
  <header style="padding: 20px 14px 0; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Back to workout list" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #8A9593">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px">
      <div style="font-size: 14px; font-weight: 600">Push · Chest &amp; Triceps</div>
      <div style="display: flex; align-items: center; gap: 6px; color: #8A9593; font-size: 11.5px">
        <span style="display: block; width: 6px; height: 6px; border-radius: 50%; background: {{accent}}"></span>
        <span class="num">09:40</span>
        <span>elapsed</span>
      </div>
    </div>
    <button type="button" aria-label="Workout options" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #8A9593">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    </button>
  </header>

  <section style="padding: 12px 14px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Previous exercise" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #1A1D1F; border: 1px solid #2A2F31; color: #8A9593">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <h1 style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; text-align: center">Bench Press <span style="color: #8A9593">· Barbell, close grip</span></h1>
        <div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A9593">Exercise 1 of 6</div>
      </div>
      <button type="button" aria-label="Next exercise" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #1A1D1F; border: 1px solid #2A2F31; color: #8A9593">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 4px; margin-top: 14px">
      <span style="display: flex; flex-grow: 1; height: 4px; border-radius: 2px; background: #2A2F31; overflow: hidden"><span style="display: block; width: 40%; background: {{accent}}"></span></span><span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span><span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span><span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span><span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span><span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span>
    </div>
  </section>
</div>
    <div style="position: absolute; inset: 0; background: rgba(9, 11, 11, 0.74)"></div>
    <section aria-label="Bench Press history" style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; box-sizing: border-box; background: #1A1D1F; border-top: 1px solid #343A3C; border-radius: 22px 22px 0 0; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 14px">
      <span style="align-self: center; display: block; width: 42px; height: 4px; border-radius: 2px; background: #3A4245"></span>
      <div style="display: flex; align-items: flex-start; gap: 10px">
        <div style="flex-grow: 1; min-width: 0">
          <h2 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.25">Bench Press <span style="color: #8A9593">· Barbell</span></h2>
          <div style="margin-top: 3px; font-size: 11.5px; color: #8A9593">History · pick a session to compare</div>
        </div>
        <button type="button" aria-label="Close history" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #222628; border: 1px solid #2A2F31; color: #8A9593"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; gap: 8px"><button type="button" aria-pressed="true" style="flex-grow: 1; height: 38px; border-radius: 11px; font-size: 13px; background: #1E3A41; border: 1px solid {{accent}}; color: #E8EDEC; font-weight: 600">22 Oct</button><button type="button" aria-pressed="false" style="flex-grow: 1; height: 38px; border-radius: 11px; font-size: 13px; border: 1px solid #2A2F31; color: #8A9593; font-weight: 500">15 Oct</button><button type="button" aria-pressed="false" style="flex-grow: 1; height: 38px; border-radius: 11px; font-size: 13px; border: 1px solid #2A2F31; color: #8A9593; font-weight: 500">3 Oct</button></div>
        <div style="font-size: 12px; color: #8A9593">Push · Chest &amp; Triceps · <span class="num">4</span> sets · <span class="num">2,480</span> kg · <span style="color: #E8EDEC">normal grip</span></div>
      </div>
      <div style="border: 1px solid #2A2F31; border-radius: 14px; overflow: hidden">
        <div style="display: grid; grid-template-columns: 26px 1fr 38px 1.15fr; align-items: center; gap: 8px; height: 30px; padding: 0 12px; background: #16191A; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">
          <span>Set</span><span>Weight</span><span style="text-align: center">Reps</span><span style="text-align: right">Today · close grip</span>
        </div>
      <div style="display: grid; grid-template-columns: 26px 1fr 38px 1.15fr; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-top: 1px solid #22272A">
        <span class="num" style="font-size: 12px; color: #6E7A78">1</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593">80 kg</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593; text-align: center">8</span>
        <span class="num" style="font-size: 14.5px; font-weight: 500; text-align: right">70 × 8</span>
      </div>
      <div style="display: grid; grid-template-columns: 26px 1fr 38px 1.15fr; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-top: 1px solid #22272A">
        <span class="num" style="font-size: 12px; color: #6E7A78">2</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593">80 kg</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593; text-align: center">8</span>
        <span class="num" style="font-size: 14.5px; font-weight: 500; text-align: right">—</span>
      </div>
      <div style="display: grid; grid-template-columns: 26px 1fr 38px 1.15fr; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-top: 1px solid #22272A">
        <span class="num" style="font-size: 12px; color: #6E7A78">3</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593">77.5 kg</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593; text-align: center">8</span>
        <span class="num" style="font-size: 14.5px; font-weight: 500; text-align: right">—</span>
      </div>
      <div style="display: grid; grid-template-columns: 26px 1fr 38px 1.15fr; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-top: 1px solid #22272A">
        <span class="num" style="font-size: 12px; color: #6E7A78">4</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593">75 kg</span>
        <span class="num" style="font-size: 14.5px; color: #8A9593; text-align: center">9</span>
        <span class="num" style="font-size: 14.5px; font-weight: 500; text-align: right">—</span>
      </div>
      </div>
    </section>
  </div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
