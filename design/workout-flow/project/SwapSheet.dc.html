<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W7 History sheet, Reload</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="opacity: 0.3; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="text-align: center; font-size: 15px; font-weight: 700; padding-top: 12px">Pull · Back &amp; Biceps</div>
    <div style="text-align: center; font-size: 25px; font-weight: 700; padding-top: 14px">Lat Pulldown <span style="color: #8A9593">· Cable</span></div>
    <div style="height: 300px; border-radius: 16px; background: #1A1D1F; border: 1px solid #2A2F31"></div>
  </div>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(8,10,10,0.55)">
    <section role="dialog" aria-label="Lat Pulldown, Cable history" style="background: #1A1D1F; border-top: 1px solid #3A4245; border-radius: 22px 22px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 18px">
      <span style="align-self: center; display: block; width: 40px; height: 4px; border-radius: 2px; background: #3A4245"></span>
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Lat Pulldown <span style="color: #8A9593">· Cable</span></h2>
      <div role="alert" style="padding: 22px 16px; border-radius: 14px; background: #222628; border: 1px solid #2A2F31; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D8A13B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0120 0"></path><path d="M5.5 12.4a10 10 0 0113 0"></path><path d="M9 16a5 5 0 016 0"></path><path d="M3 3l18 18"></path></svg>
        <div style="font-size: 16px; font-weight: 700">Couldn't load history</div>
        <div style="font-size: 13px; line-height: 1.45; color: #8A9593; max-width: 280px">Network issue. Try again on a better connection. Sets you log now still save.</div>
      </div>
      <button type="button" style="height: 54px; border-radius: 15px; background: {{accent}}; color: #121414; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7"></path><path d="M21 4v5h-5"></path></svg>Reload</button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
