<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TICKET-040 — Edit in the row strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
abbr { text-decoration: none; }
input { font: inherit; color: inherit; background: none; border: none; outline: none; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 14px 0; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Back to workout list" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #8A9593">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px">
      <div style="font-size: 14px; font-weight: 600">Push · Chest &amp; Triceps</div>
      <div style="display: flex; align-items: center; gap: 6px; color: #8A9593; font-size: 11.5px">
        <span style="display: block; width: 6px; height: 6px; border-radius: 50%; background: {{accent}}"></span>
        <span class="num">28:05</span>
        <span>elapsed</span>
      </div>
    </div>
    <button type="button" aria-label="Workout options" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #8A9593">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    </button>
  </header>

  <section style="padding: 12px 14px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Previous exercise" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #1A1D1F; border: 1px solid #2A2F31; color: #8A9593">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <h1 style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; text-align: center">Bench Press</h1>
        <div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A9593">Exercise 3 of 6</div>
      </div>
      <button type="button" aria-label="Next exercise" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #1A1D1F; border: 1px solid #2A2F31; color: #8A9593">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 4px; margin-top: 14px">
      <span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="display: flex; flex-grow: 1; height: 4px; border-radius: 2px; background: #2A2F31; overflow: hidden"><span style="display: block; width: 80%; background: {{accent}}"></span></span>
      <span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span>
      <span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span>
      <span style="display: block; flex-grow: 1; height: 4px; border-radius: 2px; background: #222628"></span>
    </div>
  </section>

  <main style="flex-grow: 1; min-height: 0; padding: 16px 14px 0; display: flex; flex-direction: column; gap: 14px">

    <section style="background: #1A1D1F; border: 1px solid #2A2F31; border-radius: 16px; padding: 14px 14px 16px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #E8EDEC">Set 5</div>
        <button type="button" aria-label="Last time 60 by 8. Show history" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-radius: 999px; background: #222628; border: 1px solid #3A4245; color: #E8EDEC">
          <span style="font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8A9593">Last time</span>
          <span class="num" style="font-size: 13px; font-weight: 500">60 × 8</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A9593" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg>
        </button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px">
        <div style="display: flex; flex-direction: column; gap: 7px">
          <label for="e9w" style="font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Weight · kg</label>
          <div style="height: 62px; border-radius: 13px; background: #222628; border: 1px solid #3A4245; display: flex; align-items: center; justify-content: center">
            <input id="e9w" class="num" type="text" inputmode="decimal" placeholder="60" style="width: 100%; height: 100%; text-align: center; font-size: 30px; font-weight: 500" />
          </div>
          <div style="display: flex; gap: 6px">
            <button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 13px">−2.5</button>
            <button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 13px">+2.5</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 7px">
          <label for="e9r" style="font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A9593">Reps</label>
          <div style="height: 62px; border-radius: 13px; background: #222628; border: 1px solid #3A4245; display: flex; align-items: center; justify-content: center">
            <input id="e9r" class="num" type="text" inputmode="numeric" placeholder="8" style="width: 100%; height: 100%; text-align: center; font-size: 30px; font-weight: 500" />
          </div>
          <div style="display: flex; gap: 6px">
            <button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 13px">−1</button>
            <button type="button" class="num" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #2A2F31; color: #8A9593; font-size: 13px">+1</button>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; margin-top: 16px">
        <button type="button" aria-label="Repeat last session's set 5: 60 kilos by 8 reps" style="width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 1px solid #3A4245; color: #8A9593">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4"></path><path d="M3.5 3.8v5h5"></path></svg>
        </button>
        <button type="button" style="flex-grow: 1; height: 56px; border-radius: 15px; background: {{accent}}; color: #121414; font-size: 16.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 9px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
          Log set 5
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 9px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #8A9593">Today</h2>
        <div style="font-size: 12px; color: #8A9593">4 sets · <span class="num" style="color: #E8EDEC">2,385</span> kg</div>
      </div>

      <ul style="margin: 0; padding: 0; list-style: none; background: #1A1D1F; border: 1px solid #2A2F31; border-radius: 14px; overflow: hidden">
        <li>
          <div style="display: flex; align-items: center; height: 44px; padding: 0 0 0 13px">
            <button type="button" aria-expanded="false" aria-label="Set 1, 60 kg by 12. Mark or edit" style="flex-grow: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; text-align: left"><span class="num" style="width: 18px; flex-shrink: 0; font-size: 12px; color: #8A9593">1</span><span style="flex-grow: 1; min-width: 0; display: flex"><span class="num" style="font-size: 15px; font-weight: 500; white-space: nowrap">60 kg × 12</span></span><span style="display: flex; flex-shrink: 0; align-items: center; gap: 4px; color: #D8A13B; font-size: 12px; font-weight: 600"><svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M6 2.4l4 6.6H2z"></path></svg><span class="num">+1 rep</span></span></button>
            <button type="button" aria-label="Remove set 1" style="width: 40px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
          </div>
        </li>
        <li style="border-top: 1px solid #22272A; background: #1C2124">
          <div style="display: flex; align-items: center; height: 44px; padding: 0 0 0 13px">
            <button type="button" aria-expanded="true" aria-label="Set 2, 56 kg by 10, felt easy, 9 kilos down. Mark or edit" style="flex-grow: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; text-align: left"><span class="num" style="width: 18px; flex-shrink: 0; font-size: 12px; color: #8A9593">2</span><span style="display: flex; align-items: center; gap: 8px; flex-grow: 1; min-width: 0"><span class="num" style="font-size: 15px; font-weight: 500; white-space: nowrap">56 kg × 10</span><abbr title="felt easy" style="display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; box-sizing: border-box; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #8A9593; color: #E8EDEC; font-size: 11px; font-weight: 700">E</abbr></span><span style="display: flex; flex-shrink: 0; align-items: center; gap: 4px; color: #8A9593; font-size: 12px; font-weight: 600"><svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M6 9.6L2 3h8z"></path></svg><span class="num">−9 kg</span></span></button>
            <button type="button" aria-label="Remove set 2" style="width: 40px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 0 13px 11px 41px">
            <div role="radiogroup" aria-label="Mark set 2" style="flex-grow: 1; min-width: 0; display: flex; gap: 8px">
              <button type="button" role="radio" aria-checked="true" style="flex-grow: 1; height: 44px; border-radius: 11px; background: #1E3A41; border: 1px solid {{accent}}; color: #E8EDEC; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><abbr title="felt easy" style="display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; box-sizing: border-box; width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid #8A9593; color: #E8EDEC; font-size: 10px; font-weight: 700">E</abbr>Easy</button>
              <button type="button" role="radio" aria-checked="false" style="flex-grow: 1; height: 44px; border-radius: 11px; border: 1px solid #3A4245; color: #E8EDEC; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><abbr title="felt hard" style="display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 6px; background: #E8EDEC; color: #121414; font-size: 10px; font-weight: 700">H</abbr>Hard</button>
            </div>
            <button type="button" aria-label="Clear mark on set 2" style="height: 44px; padding: 0 6px; color: #8A9593; font-size: 13px; font-weight: 600">Clear</button>
            <span aria-hidden="true" style="display: block; width: 1px; height: 26px; background: #2A2F31"></span>
            <button type="button" aria-label="Edit set 2" style="height: 44px; padding: 0 10px; border-radius: 11px; border: 1px solid #3A4245; color: #E8EDEC; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>
              Edit
            </button>
          </div>
        </li>
        <li style="border-top: 1px solid #22272A">
          <div style="display: flex; align-items: center; height: 44px; padding: 0 0 0 13px">
            <button type="button" aria-expanded="false" aria-label="Set 3, 65 kg by 9. Mark or edit" style="flex-grow: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; text-align: left"><span class="num" style="width: 18px; flex-shrink: 0; font-size: 12px; color: #8A9593">3</span><span style="flex-grow: 1; min-width: 0; display: flex"><span class="num" style="font-size: 15px; font-weight: 500; white-space: nowrap">65 kg × 9</span></span><span style="display: flex; flex-shrink: 0; align-items: center; gap: 4px; color: #D8A13B; font-size: 12px; font-weight: 600"><svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M6 2.4l4 6.6H2z"></path></svg><span class="num">+1 rep</span></span></button>
            <button type="button" aria-label="Remove set 3" style="width: 40px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
          </div>
        </li>
        <li style="border-top: 1px solid #22272A">
          <div style="display: flex; align-items: center; height: 44px; padding: 0 0 0 13px">
            <button type="button" aria-expanded="false" aria-label="Set 4, 65 kg by 8. Mark or edit" style="flex-grow: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; text-align: left"><span class="num" style="width: 18px; flex-shrink: 0; font-size: 12px; color: #8A9593">4</span><span style="flex-grow: 1; min-width: 0; display: flex"><span class="num" style="font-size: 15px; font-weight: 500; white-space: nowrap">65 kg × 8</span></span><span class="num" style="flex-shrink: 0; color: #8A9593; font-size: 12px; font-weight: 600">matched</span></button>
            <button type="button" aria-label="Remove set 4" style="width: 40px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #8A9593"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
          </div>
        </li>
      </ul>
    </section>
  </main>

  <footer style="padding: 12px 14px 22px; background: #16191A; border-top: 1px solid #22272A">
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; border: 1px solid #3A4245; color: #E8EDEC; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 9px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A9593" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg>
      Finish workout
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
