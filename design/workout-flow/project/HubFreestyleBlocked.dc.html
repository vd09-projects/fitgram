<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freestyle tapped while Legs runs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="padding: 18px 16px 0; display: flex; align-items: center; gap: 8px">
    <h1 style="margin: 0; flex-grow: 1; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Workout</h1>
    <button type="button" style="height: 40px; padding: 0 12px; border-radius: 20px; background: #222628; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Plans</button><button type="button" style="height: 40px; padding: 0 12px; border-radius: 20px; background: #222628; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</button>
  </header>
  <main style="flex-grow: 1; min-height: 0; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 8px 0 14px; border-radius: 16px; background: #1A1D1F; border: 1px solid {{accent}}; text-decoration: none; color: #E8EDEC">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}; flex-shrink: 0"></span>
      <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 700">Legs in progress</span><span style="font-size: 12px; color: #8A9593"><span class="num">23:14</span> · <span class="num">8</span> sets logged</span></span>
      <span style="height: 40px; padding: 0 16px; border-radius: 12px; background: {{accent}}; color: #121414; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Resume</span>
    </a><div style="display: flex; align-items: center; min-height: 44px">
      <h2 style="margin: 0; flex-grow: 1; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #8A9593">Pick today's workout</h2>
      <a href="#" style="min-height: 44px; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; text-decoration: none">All plans <span class="num" style="color: #8A9593">5</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></a>
    </div>
    <p style="margin: -6px 0 4px; font-size: 13px; color: #8A9593">Longest since you did it first.</p><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 128px; padding: 14px; border-radius: 16px; background: #1A1D1F; border: 1px solid #2A2F31; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 700; line-height: 1.25">Shoulders &amp; Core</span>
        <span><span class="num" style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; ">9d</span><span style="display: block; font-size: 11px; color: #8A9593">since last · 6 exercises</span></span>
      </button><button type="button" style="height: 128px; padding: 14px; border-radius: 16px; background: #1E3A41; border: 1.5px solid {{accent}}; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 700; line-height: 1.25">Legs · Quads &amp; Glutes</span>
        <span><span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span><span class="num" style="font-size: 26px; font-weight: 600">23:14</span></span><span style="display: block; font-size: 11px; color: #E8EDEC">in progress · 8 sets</span></span>
      </button><button type="button" style="height: 128px; padding: 14px; border-radius: 16px; background: #1A1D1F; border: 1px solid #2A2F31; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 700; line-height: 1.25">Push · Chest &amp; Triceps</span>
        <span><span class="num" style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; ">4d</span><span style="display: block; font-size: 11px; color: #8A9593">since last · 6 exercises</span></span>
      </button><button type="button" style="height: 128px; padding: 14px; border-radius: 16px; background: #1A1D1F; border: 1px solid #2A2F31; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 700; line-height: 1.25">Pull · Back &amp; Biceps</span>
        <span><span class="num" style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; ">1d</span><span style="display: block; font-size: 11px; color: #8A9593">since last · 6 exercises</span></span>
      </button>
      <button type="button"  style="grid-column: span 2; height: 64px; padding: 0 14px; border-radius: 16px; border: 1px dashed #6A7474; display: flex; align-items: center; gap: 12px">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #1E3A41; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Freestyle</span><span style="font-size: 12px; color: #8A9593">No plan. Pick exercises as you go.</span></span>
      </button>
    </div>
  </main>
  <nav style="height: 64px; flex-shrink: 0; display: flex; background: #1A1D1F; border-top: 1px solid #2A2F31">
    <button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: #8A9593"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Feed</button><button type="button" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: #E8EDEC"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"></path></svg>Workout</button><button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: #8A9593"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Log Workout</button>
  </nav>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6,8,8,0.72)"></div>
  <section role="dialog" aria-label="Freestyle" style="position: absolute; left: 10px; right: 10px; bottom: 10px; box-sizing: border-box; padding: 10px 20px 18px; border-radius: 26px; background: #1A1D1F; border: 1px solid #3A4245; display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A4245"></span>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px">
      <span style="width: 40px; height: 40px; border-radius: 20px; background: #1E3A41; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 22px; font-weight: 700">Freestyle</span><span style="font-size: 13px; color: #8A9593">No plan. Pick exercises as you go.</span></span>
      <button type="button" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A9593" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <p style="margin: 18px 0 0; font-size: 14px; line-height: 1.45; color: #8A9593; text-align: center">Legs is in progress. Finish or discard it to start a Freestyle.</p>
    <a href="#" style="margin-top: 10px; height: 52px; border-radius: 16px; border: 1px solid #6A7474; color: #E8EDEC; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>Back to Legs · <span class="num">23:14</span></a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
