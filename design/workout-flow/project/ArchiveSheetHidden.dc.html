<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T1 — Plan sheet, archived hidden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #5FA8B8; } a:hover { color: #8CC6D2; }
input { font: inherit; color: inherit; background: none; border: none; outline: none; }
input::placeholder { color: #8A9593; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
.num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121414; color: #E8EDEC; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="padding: 22px 14px 4px; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #8A9593"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <h1 style="flex-grow: 1; margin: 0 48px 0 0; text-align: center; font-size: 18px; font-weight: 700">Manage Workout</h1>
  </header>
  <main style="flex-grow: 1; min-height: 0; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px; opacity: 0.35;">
      <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #8A9593">Plan</div>
      <button type="button" aria-haspopup="listbox" aria-expanded="false" style="height: 50px; padding: 0 14px; border-radius: 13px; background: #222628; border: 1px solid #6A7474; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 18px; font-weight: 700">Push · Chest &amp; Triceps<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9593" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
  </main>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(8,10,10,0.6)">
    <section role="dialog" aria-label="Choose a plan" style="max-height: 88%; box-sizing: border-box; background: #1A1D1F; border-top: 1px solid #3A4245; border-radius: 22px 22px 0 0; padding: 10px 14px 26px; display: flex; flex-direction: column; gap: 12px">
      <span style="align-self: center; display: block; width: 40px; height: 4px; border-radius: 2px; background: #3A4245"></span>
      <div style="display: flex; align-items: center; min-height: 44px">
        <h2 style="flex-grow: 1; margin: 0; font-size: 18px; font-weight: 700">Plan</h2>
      <button type="button" aria-expanded="false" style="min-height: 44px; padding: 0 2px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #E8EDEC"><span style="display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>Show archived</button>
      </div>
      <button type="button" style="height: 52px; padding: 0 14px; border-radius: 13px; border: 1px dashed #3A4245; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><span style="color: {{accent}}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>New plan</button>
      <ul role="listbox" style="margin: 0; padding: 0; list-style: none; background: #121414; border: 1px solid #2A2F31; border-radius: 14px; overflow: hidden">
        <li style="">
          <button type="button" role="option" aria-selected="false" style="width: 100%; min-height: 58px; padding: 8px 14px 8px 14px; box-sizing: border-box;  display: flex; align-items: center; gap: 10px">
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600; color: #E8EDEC">Pull · Back &amp; Biceps</span><span style="font-size: 12px; color: #8A9593"><span class="num">6</span> exercises</span></span>
          </button>
        </li>
        <li style="border-top: 1px solid #22272A">
          <button type="button" role="option" aria-selected="true" style="width: 100%; min-height: 58px; padding: 8px 14px 8px 14px; box-sizing: border-box; background: #1E3A41; display: flex; align-items: center; gap: 10px">
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600; color: #E8EDEC">Push · Chest &amp; Triceps</span><span style="font-size: 12px; color: #8A9593"><span class="num">6</span> exercises</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
          </button>
        </li>
        <li style="border-top: 1px solid #22272A">
          <button type="button" role="option" aria-selected="false" style="width: 100%; min-height: 58px; padding: 8px 14px 8px 14px; box-sizing: border-box;  display: flex; align-items: center; gap: 10px">
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600; color: #E8EDEC">Legs · Quads &amp; Glutes</span><span style="font-size: 12px; color: #8A9593"><span class="num">5</span> exercises</span></span>
          </button>
        </li>
      </ul>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5FA8B8' };
  }
}
</script>
</body>
</html>
