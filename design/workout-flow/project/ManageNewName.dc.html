        </li>
        
        <li style="border-top: 1px solid #22272A; ">
          <button type="button" role="option" aria-selected="false" style="width: 100%; min-height: 58px; padding: 8px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; text-align: left">

        </li>

    </section>
  </div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5FA8B8","options":["#5FA8B8","#B5A3CF","#D8A13B","#8FB573"]},"$preview":{"width":390,"height":844}}'>
